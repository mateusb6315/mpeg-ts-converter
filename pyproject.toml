[project]
name = "projeto-broadcast"
version = "0.0.3b1"
description = "Conversor desktop MPEG-TS para HEVC Main10 com NVEncC"
authors = [
    {name = "Mateus Barbosa"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PyQt6==6.12.0",
    "PyQt6-Qt6==6.12.0",
    "PyQt6_sip==13.13.0"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.poetry.group.dev.dependencies]
pytest = "9.2.0"

[tool.poetry.group.build.dependencies]
pyinstaller = "6.22.3"
pyinstaller-hooks-contrib = "2026.9"
