name: Build beta manual
on:
  workflow_dispatch:
    inputs:
      versao:
        description: Versao beta livre
        required: true
        default: 0.0.3-beta1
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VERSAO_BETA: ${{ inputs.versao }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pytest -v
      - run: python scripts/compilar_beta.py --versao "$env:VERSAO_BETA"
      - run: python scripts/release.py --artefato "prototypes/beta/mpeg-ts-converter $env:VERSAO_BETA"
      - uses: actions/upload-artifact@v4
        with:
          name: candidato-beta
          path: prototypes/beta/
