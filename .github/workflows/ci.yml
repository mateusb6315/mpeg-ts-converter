name: Validacao Windows
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  testes:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: python .agents/skills/arquitetura-mvc-pyqt6/scripts/validar_arquitetura.py
      - run: python scripts/auditar_workspace.py
      - run: python -m pytest -v --junitxml=resultados.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-testes
          path: resultados.xml
